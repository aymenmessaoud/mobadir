<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" direction="rtl">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="340" fill="url(#grad)"/>
  <rect width="800" height="340" fill="url(#glow)"/>
  
  <!-- Subtle pattern dots -->
  <g opacity="0.12" fill="#ffffff">
    <circle cx="50" cy="50" r="3"/><circle cx="100" cy="50" r="3"/><circle cx="150" cy="50" r="3"/>
    <circle cx="50" cy="100" r="3"/><circle cx="100" cy="100" r="3"/><circle cx="150" cy="100" r="3"/>
    <circle cx="50" cy="150" r="3"/><circle cx="100" cy="150" r="3"/><circle cx="150" cy="150" r="3"/>
  </g>

  <!-- Graphic emblem -->
  <g transform="translate(60, 0)">
    <circle cx="600" cy="170" r="50" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 6"/><circle cx="600" cy="170" r="26" fill="#0284c7"/><circle cx="560" cy="130" r="8" fill="#38bdf8"/><circle cx="640" cy="210" r="8" fill="#38bdf8"/><line x1="565" y1="135" x2="590" y2="160" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <!-- Typography overlay -->
  <text x="40" y="240" font-family="Tajawal, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#ffffff">الأسبوع الوطني للابتكار والذكاء الاصطناعي</text>
  <text x="40" y="280" font-family="Tajawal, Segoe UI, sans-serif" font-size="16" font-weight="500" fill="#38bdf8">تنظيم الفعاليات وتأطير الورشات</text>
</svg>