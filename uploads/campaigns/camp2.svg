<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="340" viewBox="0 0 800 340" xmlns="http://www.w3.org/2000/svg" direction="rtl">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="340" fill="url(#grad)"/>
  <rect width="800" height="340" fill="url(#glow)"/>
  
  <!-- Subtle pattern dots -->
  <g opacity="0.12" fill="#ffffff">
    <circle cx="50" cy="50" r="3"/><circle cx="100" cy="50" r="3"/><circle cx="150" cy="50" r="3"/>
    <circle cx="50" cy="100" r="3"/><circle cx="100" cy="100" r="3"/><circle cx="150" cy="100" r="3"/>
    <circle cx="50" cy="150" r="3"/><circle cx="100" cy="150" r="3"/><circle cx="150" cy="150" r="3"/>
  </g>

  <!-- Graphic emblem -->
  <g transform="translate(60, 0)">
    <rect x="530" y="110" width="140" height="100" rx="12" fill="#312e81" stroke="#818cf8" stroke-width="4"/><circle cx="600" cy="195" r="8" fill="#a5b4fc"/><line x1="560" y1="230" x2="640" y2="230" stroke="#818cf8" stroke-width="4"/><line x1="600" y1="210" x2="600" y2="230" stroke="#818cf8" stroke-width="4"/>
  </g>

  <!-- Typography overlay -->
  <text x="40" y="240" font-family="Tajawal, Segoe UI, sans-serif" font-size="28" font-weight="800" fill="#ffffff">محو الأمية الرقمية وتدريب كبار السن</text>
  <text x="40" y="280" font-family="Tajawal, Segoe UI, sans-serif" font-size="16" font-weight="500" fill="#818cf8">نادي الابتكار والرقمنة</text>
</svg>